name: Build 360T7

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -a -f

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Clone source code
        run: |
          # 拉取 H 大针对 MT7981 优化的源码
          git clone --depth 1 https://github.com/hanwckf/immortalwrt-mt798x openwrt
          cd openwrt
          # 添加 Lucky、PassWall 和 Hello World 插件源
          echo 'src-git lucky https://github.com/gdy666/luci-app-lucky.git' >> feeds.conf.default
          echo 'src-git passwall https://github.com/xiaorouji/openwrt-passwall.git' >> feeds.conf.default
          echo 'src-git helloworld https://github.com/fw876/helloworld.git' >> feeds.conf.default
          
          ./scripts/feeds update -a
          
          # 强制删除导致编译中断的冲突插件
          rm -rf feeds/helloworld/dns2socks-rust
          rm -rf feeds/helloworld/shadow-tls
          rm -rf feeds/helloworld/shadowsocks-rust
          rm -rf feeds/helloworld/tuic-client
          
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          cd openwrt
          # 使用 360T7 硬件配置
          cp -f defconfig/mt7981-ax3000.config .config
          # 修改后台 IP 为 192.168.10.1 以避开你的光猫网段
          sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh
