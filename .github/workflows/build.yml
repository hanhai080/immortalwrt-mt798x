name: Build 360T7

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -a -f

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Clone source code
        run: |
          # 拉取 H 大针对 MT7981 优化的核心源码
          git clone --depth 1 https://github.com/hanwckf/immortalwrt-mt798x openwrt
          cd openwrt
          
          # 1. 正常添加 Lucky 插件
          echo 'src-git lucky https://github.com/gdy666/luci-app-lucky.git' >> feeds.conf.default
          
          # 2. 直接克隆 Helloworld 和 Passwall 到 package 目录，彻底绕过 feed 索引报错
          git clone --depth 1 https://github.com/fw876/helloworld.git package/helloworld
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall.git package/passwall

          # 3. 强制物理删除 package 目录下所有会导致报错的 Rust 文件夹
          find package/helloworld/ -name "*rust*" -o -name "*shadow-tls*" -o -name "*tuic-client*" | xargs rm -rf
          find package/passwall/ -name "*rust*" -o -name "*shadow-tls*" | xargs rm -rf
          
          # 4. 更新并安装剩下正常的插件
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          cd openwrt
          # 使用 360T7 硬件配置
          cp -f defconfig/mt7981-ax3000.config .config
          # 修改后台 IP 为 192.168.10.1 以避开你的 192.168.0.1 光猫
          sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_360T7_Firmware
          path: openwrt/bin/targets/
