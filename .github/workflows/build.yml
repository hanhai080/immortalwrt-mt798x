name: Build 360T7

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -a -f

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev wget

      - name: Clone source code
        run: |
          # 拉取 H 大针对 MT7981 优化的核心源码
          git clone --depth 1 https://github.com/hanwckf/immortalwrt-mt798x openwrt
          cd openwrt
          
          # 1. 添加 Lucky 插件源
          echo 'src-git lucky https://github.com/gdy666/luci-app-lucky.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 2. 【核心修复】手动下载 Helloworld 和 Passwall 压缩包，彻底避开 Username 验证报错
          mkdir -p package/community
          wget -qO- https://github.com/fw876/helloworld/archive/refs/heads/master.tar.gz | tar xz -C package/community
          mv package/community/helloworld-master package/community/helloworld
          
          wget -qO- https://github.com/xiaorouji/openwrt-passwall/archive/refs/heads/main.tar.gz | tar xz -C package/community
          mv package/community/openwrt-passwall-main package/community/passwall

          # 3. 【强力物理清理】在系统扫描前，强行删除所有带 rust、tls、tuic 的文件夹
          find package/community/ -name "*rust*" -o -name "*shadow-tls*" -o -name "*tuic-client*" | xargs rm -rf
          
      - name: Load Custom Configuration
        run: |
          cd openwrt
          # 使用 360T7 硬件配置
          cp -f defconfig/mt7981-ax3000.config .config
          # 修改后台 IP 为 192.168.10.1
          sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_360T7_Firmware
          path: openwrt/bin/targets/
